name: ci

on:
  push:
  pull_request:

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check

  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile addon/__init__.py addon/bridge_server.py addon/checkpoint_paths.py addon/engine.py addon/execution_budget.py addon/field_ops.py addon/hooks.py addon/modeling.py addon/policy.py addon/quality.py addon/references.py addon/runtime_guard.py scripts/blender-smoke.py
      - run: python -m unittest discover -s tests -v
